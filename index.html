<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>원신 육성 룰렛</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      font-family: 'Segoe UI', -apple-system, sans-serif;
      background: #12131C; color: #FFF;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 15px 10px;
    }

    h1 { font-size: 1.3rem; margin-bottom: 10px; color: #F1C40F; text-align: center; }

    /* 🎰 슬롯머신 컨테이너 */
    .slot-wrapper {
      position: relative;
      width: 280px;
      height: 280px;
      margin: 5px auto;
      border: 4px solid #F1C40F;
      border-radius: 20px;
      background: #1A1C29;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(241, 196, 15, 0.25);
    }
    @media (min-width: 480px) { 
      .slot-wrapper { width: 320px; height: 320px; } 
    }

    .slot-window {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .slot-reel {
      display: flex;
      flex-direction: column;
      align-items: center;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
    }

    .slot-item {
      width: 100%;
      height: 280px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-sizing: border-box;
      padding: 10px;
    }
    @media (min-width: 480px) { 
      .slot-item { height: 320px; } 
    }

    /* 슬롯 내부 초상화 */
    .slot-avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: #2A2D45;
      border: 4px solid #777;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.6);
    }
    .slot-avatar img { width: 100%; height: 100%; object-fit: cover; }
    
    .slot-char-name {
      font-size: 18px;
      font-weight: bold;
      color: #FFF;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }

    /* Center Indicator Arrow */
    .slot-pointer-left, .slot-pointer-right {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      font-size: 20px;
      color: #F1C40F;
      z-index: 10;
      text-shadow: 0 0 8px rgba(241, 196, 15, 0.8);
    }
    .slot-pointer-left { left: 8px; }
    .slot-pointer-right { right: 8px; }

    /* 버튼 컨트롤 영역 */
    .controls { display: flex; gap: 8px; margin-top: 15px; width: 100%; max-width: 380px; }
    .btn {
      flex: 1; padding: 12px 0; font-size: 14px; cursor: pointer; border: none;
      border-radius: 12px; font-weight: bold; transition: 0.2s;
    }
    .btn-spin { background: linear-gradient(135deg, #FF4B2B, #FF416C); color: #FFF; flex: 1.2; }
    .btn-spin:disabled { background: #4A4D68; color: #888; cursor: not-allowed; }
    .btn-list { background: linear-gradient(135deg, #2193b0, #6dd5ed); color: #FFF; }
    .btn-setting { background: linear-gradient(135deg, #4A00E0, #8E2DE2); color: #FFF; }

    /* 모달 공통 */
    .modal-backdrop {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(4px);
      justify-content: center; align-items: center; z-index: 1000; padding: 10px;
    }

    /* 📱 모바일 맞춤 컴팩트 결과 카드 모달 */
    .result-card {
      position: relative; background: #1E2030; border: 2px solid #F1C40F;
      border-radius: 16px; width: 100%; max-width: 380px;
      max-height: 90vh; overflow-y: auto;
      padding: 12px 14px;
      box-shadow: 0 0 25px rgba(241, 196, 15, 0.2);
      display: flex; flex-direction: column; align-items: center;
      animation: popUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popUp { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }

    .close-btn {
      position: absolute; top: 8px; right: 10px; width: 28px; height: 28px;
      border-radius: 50%; background: rgba(255,255,255,0.1); border: none;
      color: #AAA; font-size: 18px; cursor: pointer; z-index: 10;
    }

    /* 상단 비주얼 영역 (크기 축소) */
    .char-avatar-frame {
      width: 64px; height: 64px; border-radius: 50%;
      background: #2A2D45; border: 3px solid #777;
      overflow: hidden; display: flex; align-items: center; justify-content: center;
      margin-top: 2px; margin-bottom: 4px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }
    .char-avatar-frame img { width: 100%; height: 100%; object-fit: cover; }

    /* 원소별 테두리 색상 */
    .elem-pyro { border-color: #FF4D4D !important; box-shadow: 0 0 10px rgba(255, 77, 77, 0.4); }
    .elem-hydro { border-color: #3399FF !important; box-shadow: 0 0 10px rgba(51, 153, 255, 0.4); }
    .elem-anemo { border-color: #2ECC71 !important; box-shadow: 0 0 10px rgba(46, 204, 113, 0.4); }
    .elem-electro { border-color: #A64DFF !important; box-shadow: 0 0 10px rgba(166, 77, 255, 0.4); }
    .elem-dendro { border-color: #7ACC29 !important; box-shadow: 0 0 10px rgba(122, 204, 41, 0.4); }
    .elem-cryo { border-color: #80E5FF !important; box-shadow: 0 0 10px rgba(128, 229, 255, 0.4); }
    .elem-geo { border-color: #F1C40F !important; box-shadow: 0 0 10px rgba(241, 196, 15, 0.4); }

    .char-name-title { font-size: 17px; font-weight: bold; color: #FFF; margin-bottom: 2px; }
    .char-status-badge { font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 10px; margin-bottom: 8px; }
    .badge-none { background: rgba(149, 165, 166, 0.2); color: #95A5A6; border: 1px solid #95A5A6; }
    .badge-semi { background: rgba(243, 156, 18, 0.2); color: #F39C12; border: 1px solid #F39C12; }
    .badge-final { background: rgba(231, 76, 60, 0.2); color: #E74C3C; border: 1px solid #E74C3C; }

    /* 원형 특성 아이콘 (크기 축소) */
    .talent-container {
      display: flex; justify-content: center; gap: 16px;
      width: 100%; margin-bottom: 6px; padding: 2px 0;
    }
    .talent-circle-item {
      display: flex; flex-direction: column; align-items: center; position: relative;
    }
    .talent-icon-circle {
      width: 38px; height: 38px; border-radius: 50%;
      background: radial-gradient(circle, #3A3D5D 0%, #1A1B29 100%);
      border: 2px solid #F1C40F; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px; box-shadow: 0 0 8px rgba(241, 196, 15, 0.2);
    }
    .talent-icon-circle img { width: 100%; height: 100%; object-fit: cover; }
    .talent-lvl-badge {
      position: absolute; bottom: -5px; background: #282B42;
      border: 1px solid #F1C40F; border-radius: 8px;
      padding: 0px 5px; font-size: 9px; font-weight: bold; color: #FFF;
      z-index: 2;
    }

    /* 하단 스펙 그리드 레이아웃 (간격 및 패딩 축소) */
    .spec-grid { width: 100%; display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
    .spec-row { background: #141522; padding: 5px 10px; border-radius: 6px; border: 1px solid #2C2F48; display: flex; align-items: center; }
    .spec-row-multi { display: grid; gap: 5px; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    
    .spec-item { background: #141522; padding: 5px 6px; border-radius: 6px; border: 1px solid #2C2F48; text-align: center; }
    .spec-label { font-size: 10px; color: #888; margin-bottom: 1px; }
    .spec-val { font-weight: bold; color: #FFF; font-size: 12px; }

    /* 메모 박스 축소 */
    .spec-memo-box {
      background: #141522; border: 1px dashed #3F4468; border-radius: 6px;
      padding: 6px 10px; font-size: 11px; color: #DDD; line-height: 1.3;
      white-space: pre-wrap; word-break: break-word; text-align: left;
    }

    /* 잠김 안내 상자 */
    .locked-box {
      background: #141522; border: 1px dashed #E74C3C; border-radius: 10px;
      padding: 15px 10px; text-align: center; color: #888; font-size: 12px; line-height: 1.5;
      width: 100%; margin-top: 5px;
    }

    /* 📋 목록 모달 스타일 */
    .list-modal-card {
      background: #1E2030; border-radius: 16px; width: 100%; max-width: 420px;
      max-height: 80vh; padding: 15px; display: flex; flex-direction: column; gap: 10px;
      position: relative; border: 1px solid #3F4468;
    }
    .char-card-list { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .char-select-card {
      background: #282B42; border-radius: 10px; padding: 8px 10px; display: flex;
      align-items: center; justify-content: space-between; cursor: pointer;
      border: 1px solid #3F4468; transition: 0.2s;
    }
    .char-select-card:hover { border-color: #F1C40F; background: #323652; }

    /* ⚙️ 설정 모달 스타일 */
    .setting-card { background: #1E2030; border-radius: 16px; width: 100%; max-width: 450px; max-height: 85vh; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
    .setting-add-row { display: flex; gap: 6px; align-items: center; }
    .btn-add-char {
      background: linear-gradient(135deg, #27ae60, #2ecc71);
      color: #FFF; border: none; border-radius: 6px;
      padding: 8px 14px; font-size: 13px; font-weight: bold;
      cursor: pointer; white-space: nowrap; transition: 0.2s;
    }

    .btn-del-char {
      background: rgba(231, 76, 60, 0.15); color: #E74C3C;
      border: 1px solid #E74C3C; border-radius: 6px;
      padding: 2px 8px; font-size: 11px; cursor: pointer; transition: 0.2s;
    }

    /* ON/OFF 스위치 토글 스타일 */
    .switch { position: relative; display: inline-block; width: 40px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #4A4D68; transition: .3s; border-radius: 20px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .3s; border-radius: 50%;
    }
    input:checked + .slider { background-color: #2ECC71; }
    input:checked + .slider:before { transform: translateX(20px); }

    .setting-list { overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .setting-item { background: #282B42; border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 6px; }
    .talent-input-group { display: flex; flex-direction: column; gap: 4px; background: #1A1C2B; padding: 6px; border-radius: 6px; }
    .talent-input-row { display: flex; gap: 4px; }
    
    input[type="text"], select, textarea { background: #141522; color: #FFF; border: 1px solid #3F4468; padding: 6px; border-radius: 5px; font-size: 11px; width: 100%; }
    textarea { resize: vertical; min-height: 36px; font-family: inherit; }
  </style>
</head>
<body>

  <h1>🎰 원신 육성 슬롯 룰렛</h1>

  <!-- 슬롯머신 프레임 -->
  <div class="slot-wrapper">
    <div class="slot-pointer-left">▶</div>
    <div class="slot-pointer-right">◀</div>
    <div class="slot-window">
      <div id="slotReel" class="slot-reel">
        <!-- JS에서 동적 생성 -->
      </div>
    </div>
  </div>

  <div class="controls">
    <button class="btn btn-spin" id="spinBtn" onclick="spin()">🎲 돌리기</button>
    <button class="btn btn-list" onclick="openList()">📋 목록</button>
    <button class="btn btn-setting" onclick="openSetting()">⚙️ 설정</button>
  </div>

  <!-- 결과 & 상세 스펙 모달 -->
  <div id="resultModal" class="modal-backdrop">
    <div class="result-card">
      <button class="close-btn" onclick="closeResult()">&times;</button>
      
      <div class="char-avatar-frame" id="resultAvatar">
        <span style="color: #6C7293; font-size: 10px;">사진 없음</span>
      </div>
      <div class="char-name-title" id="resultName">캐릭터 이름</div>
      <div class="char-status-badge" id="resultStatus">육성 단계</div>
      
      <!-- 잠김 안내 창 -->
      <div id="lockedContainer" class="locked-box" style="display: none;">
        🔒 <strong style="color:#FFF;">미해금 캐릭터</strong><br>
        아직 룰렛에서 선택되지 않았습니다.<br>룰렛을 돌려서 캐릭터 스펙을 해금해보세요!
      </div>

      <!-- 실제 스펙 영역 -->
      <div id="specContainer" class="spec-grid">
        
        <!-- 원형 특성 아이콘 3개 -->
        <div class="talent-container">
          <div class="talent-circle-item">
            <div class="talent-icon-circle" id="boxTalentNa">⚔️</div>
            <div class="talent-lvl-badge" id="valTalentNa">1</div>
          </div>
          <div class="talent-circle-item">
            <div class="talent-icon-circle" id="boxTalentE">🌀</div>
            <div class="talent-lvl-badge" id="valTalentE">1</div>
          </div>
          <div class="talent-circle-item">
            <div class="talent-icon-circle" id="boxTalentQ">💥</div>
            <div class="talent-lvl-badge" id="valTalentQ">1</div>
          </div>
        </div>

        <div class="spec-row"><span class="spec-label" style="width:45px;">무기</span><span class="spec-val" id="valWeapon">-</span></div>
        <div class="spec-row"><span class="spec-label" style="width:45px;">성유물</span><span class="spec-val" id="valArtifact">-</span></div>
        
        <div class="spec-row-multi grid-3">
          <div class="spec-item"><div class="spec-label">공격력</div><div class="spec-val" id="valAtk">-</div></div>
          <div class="spec-item"><div class="spec-label">방어력</div><div class="spec-val" id="valDef">-</div></div>
          <div class="spec-item"><div class="spec-label">체력</div><div class="spec-val" id="valHp">-</div></div>
        </div>

        <div class="spec-row-multi grid-2">
          <div class="spec-item"><div class="spec-label">치명타 확률</div><div class="spec-val" id="valCritRate">-</div></div>
          <div class="spec-item"><div class="spec-label">치명타 피해</div><div class="spec-val" id="valCritDmg">-</div></div>
        </div>

        <div class="spec-row-multi grid-2">
          <div class="spec-item"><div class="spec-label">원소 마스터리</div><div class="spec-val" id="valEm">-</div></div>
          <div class="spec-item"><div class="spec-label">원소 충전 효율</div><div class="spec-val" id="valEr">-</div></div>
        </div>

        <div id="memoRow" class="spec-memo-box">
          <div class="spec-label" style="margin-bottom: 2px; color: #F1C40F;">📌 참고 메모</div>
          <div id="valMemo" style="color: #EEE;">-</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 📋 캐릭터 목록 모달 -->
  <div id="listModal" class="modal-backdrop">
    <div class="list-modal-card">
      <button class="close-btn" onclick="closeList()">&times;</button>
      <h2 style="font-size: 15px; color: #6dd5ed; margin-bottom: 4px;">📋 캐릭터 도감</h2>
      <div class="char-card-list" id="charCardList"></div>
    </div>
  </div>

  <!-- ⚙️ 설정 모달 -->
  <div id="settingModal" class="modal-backdrop">
    <div class="setting-card">
      <button class="close-btn" onclick="closeSetting()">&times;</button>
      <h2 style="font-size: 15px; color: #F1C40F;">⚙️ 캐릭터 세팅 및 스펙 설정</h2>
      
      <div class="setting-add-row">
        <input type="text" id="newCharName" placeholder="새 캐릭터 이름 입력">
        <button class="btn-add-char" onclick="addCharacter()">+ 추가</button>
      </div>

      <div class="setting-list" id="settingList"></div>
      <div style="text-align: right; margin-top: 4px;">
        <button class="btn btn-setting" style="padding: 8px 16px; font-size: 12px;" onclick="closeSetting()">저장 및 완료</button>
      </div>
    </div>
  </div>

  <script>
    const defaultData = [
      { name: "종려", enabled: true, level: 0, element: "geo", photoUrl: "", talentNa: "1", talentE: "9", talentQ: "9", imgNa: "", imgE: "", imgQ: "", weapon: "페보니우스 장창", artifact: "반암4", atk: "-", def: "-", hp: "50,000", critRate: "-", critDmg: "-", em: "-", er: "-", memo: "페보창 없으면 어획으로 변경 (원충 180% 챙기기)" },
      { name: "카즈하", enabled: true, level: 0, element: "anemo", photoUrl: "", talentNa: "1", talentE: "8", talentQ: "8", imgNa: "", imgE: "", imgQ: "", weapon: "강철의 벌침", artifact: "청록4", atk: "-", def: "-", hp: "-", critRate: "-", critDmg: "-", em: "900", er: "160%", memo: "서포팅 전용, 원충 최소 160 이상 유지 필수" }
    ];

    let charData = JSON.parse(localStorage.getItem("genshin_roulette_v12_data")) || defaultData;
    const spinBtn = document.getElementById("spinBtn");
    let isSpinning = false;
    let currentSequence = [];

    function saveData() { localStorage.setItem("genshin_roulette_v12_data", JSON.stringify(charData)); }
    
    function getActiveChars() { 
      return charData.filter(c => c.enabled !== false && c.level < 2); 
    }

    /* 🎰 슬롯 릴 화면 렌더링 */
    function draw() {
      const activeChars = getActiveChars();
      const reel = document.getElementById("slotReel");
      reel.style.transition = "none";
      reel.style.transform = "translateY(0px)";

      if (activeChars.length === 0) {
        reel.innerHTML = `
          <div class="slot-item">
            <span style="color:#AAA; font-size:14px;">대상 캐릭터가 없습니다!</span>
          </div>
        `;
        spinBtn.disabled = true;
        return;
      } else { 
        spinBtn.disabled = false; 
      }

      currentSequence = [];
      const repeatCount = 8;
      let html = '';

      for (let r = 0; r < repeatCount; r++) {
        activeChars.forEach((c) => {
          currentSequence.push(c);
          const elemClass = `elem-${c.element || 'pyro'}`;
          const photo = c.photoUrl ? `<img src="${c.photoUrl}">` : `<span style="font-size:11px; color:#888;">사진 없음</span>`;
          
          html += `
            <div class="slot-item">
              <div class="slot-avatar ${elemClass}">${photo}</div>
              <div class="slot-char-name">${c.name} ${c.level === 1 ? '<span style="font-size:13px; color:#F39C12;">(준종결)</span>' : ''}</div>
            </div>
          `;
        });
      }

      reel.innerHTML = html;
    }

    /* 🎰 슬롯 돌리기 실행 */
    function spin() {
      const activeChars = getActiveChars();
      if (isSpinning || activeChars.length === 0) return;

      isSpinning = true;
      spinBtn.disabled = true;

      const reel = document.getElementById("slotReel");
      const slotHeight = window.innerWidth >= 480 ? 320 : 280;

      const selectedIndex = Math.floor(Math.random() * activeChars.length);
      const selected = activeChars[selectedIndex];

      const targetRepeatIndex = 6;
      const targetGlobalIndex = (targetRepeatIndex * activeChars.length) + selectedIndex;
      const targetPositionY = targetGlobalIndex * slotHeight;

      reel.style.transition = "none";
      reel.style.transform = "translateY(0px)";

      setTimeout(() => {
        reel.style.transition = "transform 4s cubic-bezier(0.1, 0.85, 0.15, 1)";
        reel.style.transform = `translateY(-${targetPositionY}px)`;
      }, 50);

      setTimeout(() => {
        isSpinning = false;
        selected.level += 1;

        showCharDetail(selected);
        saveData();
        draw();
      }, 4200);
    }

    function setTalentBox(elementId, imgUrl, defaultEmoji) {
      const box = document.getElementById(elementId);
      if (imgUrl && imgUrl.trim() !== "") {
        box.innerHTML = `<img src="${imgUrl}">`;
      } else {
        box.innerText = defaultEmoji;
      }
    }

    function showCharDetail(selected) {
      document.getElementById("resultName").innerText = selected.name;
      const statusEl = document.getElementById("resultStatus");
      const lockedContainer = document.getElementById("lockedContainer");
      const specContainer = document.getElementById("specContainer");

      const avatar = document.getElementById("resultAvatar");
      avatar.className = `char-avatar-frame elem-${selected.element || 'pyro'}`;
      avatar.innerHTML = selected.photoUrl ? `<img src="${selected.photoUrl}">` : '<span style="color:#6C7293; font-size:10px;">사진 없음</span>';

      if (selected.level === 0) {
        statusEl.innerText = "🔒 미해금 캐릭터";
        statusEl.className = "char-status-badge badge-none";
        lockedContainer.style.display = "block";
        specContainer.style.display = "none";
      } else {
        lockedContainer.style.display = "none";
        specContainer.style.display = "flex";

        if (selected.level === 1) {
          statusEl.innerText = "🟠 준종결 달성 (육성중)";
          statusEl.className = "char-status-badge badge-semi";
        } else {
          statusEl.innerText = "🔴 종결 완료!";
          statusEl.className = "char-status-badge badge-final";
        }

        setTalentBox("boxTalentNa", selected.imgNa, "⚔️");
        setTalentBox("boxTalentE", selected.imgE, "🌀");
        setTalentBox("boxTalentQ", selected.imgQ, "💥");

        document.getElementById("valTalentNa").innerText = selected.talentNa || "1";
        document.getElementById("valTalentE").innerText = selected.talentE || "1";
        document.getElementById("valTalentQ").innerText = selected.talentQ || "1";

        document.getElementById("valWeapon").innerText = selected.weapon || "-";
        document.getElementById("valArtifact").innerText = selected.artifact || "-";
        document.getElementById("valAtk").innerText = selected.atk || "-";
        document.getElementById("valDef").innerText = selected.def || "-";
        document.getElementById("valHp").innerText = selected.hp || "-";
        document.getElementById("valCritRate").innerText = selected.critRate || "-";
        document.getElementById("valCritDmg").innerText = selected.critDmg || "-";
        document.getElementById("valEm").innerText = selected.em || "-";
        document.getElementById("valEr").innerText = selected.er || "-";

        const memoBox = document.getElementById("memoRow");
        if (selected.memo && selected.memo.trim() !== "") {
          document.getElementById("valMemo").innerText = selected.memo;
          memoBox.style.display = "block";
        } else {
          memoBox.style.display = "none";
        }
      }

      document.getElementById("resultModal").style.display = "flex";
    }

    function closeResult() { document.getElementById("resultModal").style.display = "none"; }
    
    function openList() {
      const listContainer = document.getElementById("charCardList");
      listContainer.innerHTML = "";

      const visibleChars = charData.filter(c => c.enabled !== false);

      if (visibleChars.length === 0) {
        listContainer.innerHTML = "<div style='text-align:center; color:#888; padding:15px;'>활성화된 캐릭터가 없습니다.</div>";
      } else {
        visibleChars.forEach((c) => {
          let badgeText = "🔒 미해금";
          let badgeClass = "badge-none";
          if (c.level === 1) { badgeText = "🟠 준종결"; badgeClass = "badge-semi"; }
          else if (c.level >= 2) { badgeText = "🔴 종결 완료"; badgeClass = "badge-final"; }

          const card = document.createElement("div");
          card.className = "char-select-card";
          card.onclick = () => { closeList(); showCharDetail(c); };
          card.innerHTML = `
            <div style="display:flex; align-items:center; gap:8px;">
              <div class="char-avatar-frame elem-${c.element || 'pyro'}" style="width:34px; height:34px; margin:0; border-width:2px;">
                ${c.photoUrl ? `<img src="${c.photoUrl}">` : '<span style="font-size:8px; color:#888;">N/A</span>'}
              </div>
              <strong style="font-size:13px; color:#FFF;">${c.name}</strong>
            </div>
            <span class="char-status-badge ${badgeClass}" style="margin:0;">${badgeText}</span>
          `;
          listContainer.appendChild(card);
        });
      }

      document.getElementById("listModal").style.display = "flex";
    }
    function closeList() { document.getElementById("listModal").style.display = "none"; }

    function openSetting() { renderSettingList(); document.getElementById("settingModal").style.display = "flex"; }
    function closeSetting() { document.getElementById("settingModal").style.display = "none"; saveData(); draw(); }

    function addCharacter() {
      const name = document.getElementById("newCharName").value.trim();
      if (!name) return;
      charData.push({ name: name, enabled: true, level: 0, element: "pyro", photoUrl: "", talentNa: "1", talentE: "1", talentQ: "1", imgNa: "", imgE: "", imgQ: "", weapon: "", artifact: "", atk: "", def: "", hp: "", critRate: "", critDmg: "", em: "", er: "", memo: "" });
      document.getElementById("newCharName").value = ""; renderSettingList();
    }
    function deleteChar(idx) { charData.splice(idx, 1); renderSettingList(); }

    function renderSettingList() {
      const container = document.getElementById("settingList"); container.innerHTML = "";
      charData.forEach((c, i) => {
        if (c.enabled === undefined) c.enabled = true;

        const item = document.createElement("div"); item.className = "setting-item";
        item.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:8px;">
              <label class="switch">
                <input type="checkbox" ${c.enabled ? 'checked' : ''} onchange="charData[${i}].enabled = this.checked">
                <span class="slider"></span>
              </label>
              <strong style="color:#F1C40F; font-size:13px;">${c.name}</strong>
            </div>
            <button class="btn-del-char" onclick="deleteChar(${i})">삭제</button>
          </div>
          <div style="display:flex; gap:4px;">
            <select onchange="charData[${i}].element=this.value">
              <option value="pyro" ${c.element==='pyro'?'selected':''}> 불</option>
              <option value="hydro" ${c.element==='hydro'?'selected':''}> 물</option>
              <option value="anemo" ${c.element==='anemo'?'selected':''}> 바람</option>
              <option value="electro" ${c.element==='electro'?'selected':''}> 번개</option>
              <option value="dendro" ${c.element==='dendro'?'selected':''}> 풀</option>
              <option value="cryo" ${c.element==='cryo'?'selected':''}> 얼음</option>
              <option value="geo" ${c.element==='geo'?'selected':''}> 바위</option>
            </select>
            <input type="text" placeholder="초상화 이미지 URL" value="${c.photoUrl||''}" onchange="charData[${i}].photoUrl=this.value">
          </div>

          <div class="talent-input-group">
            <span style="font-size:10px; color:#F1C40F; font-weight:bold;">✨ 특성 이미지 URL & 레벨</span>
            <div class="talent-input-row">
              <input type="text" placeholder="평타 이미지 URL" value="${c.imgNa||''}" onchange="charData[${i}].imgNa=this.value">
              <input type="text" placeholder="레벨" style="width:45px;" value="${c.talentNa||''}" onchange="charData[${i}].talentNa=this.value">
            </div>
            <div class="talent-input-row">
              <input type="text" placeholder="E스킬 이미지 URL" value="${c.imgE||''}" onchange="charData[${i}].imgE=this.value">
              <input type="text" placeholder="레벨" style="width:45px;" value="${c.talentE||''}" onchange="charData[${i}].talentE=this.value">
            </div>
            <div class="talent-input-row">
              <input type="text" placeholder="Q스킬 이미지 URL" value="${c.imgQ||''}" onchange="charData[${i}].imgQ=this.value">
              <input type="text" placeholder="레벨" style="width:45px;" value="${c.talentQ||''}" onchange="charData[${i}].talentQ=this.value">
            </div>
          </div>

          <div style="display:flex; gap:4px;">
            <input type="text" placeholder="무기" value="${c.weapon||''}" onchange="charData[${i}].weapon=this.value">
            <input type="text" placeholder="성유물" value="${c.artifact||''}" onchange="charData[${i}].artifact=this.value">
          </div>
          <div style="display:flex; gap:4px;">
            <input type="text" placeholder="공격력" value="${c.atk||''}" onchange="charData[${i}].atk=this.value">
            <input type="text" placeholder="방어력" value="${c.def||''}" onchange="charData[${i}].def=this.value">
            <input type="text" placeholder="체력" value="${c.hp||''}" onchange="charData[${i}].hp=this.value">
          </div>
          <div style="display:flex; gap:4px;">
            <input type="text" placeholder="치확" value="${c.critRate||''}" onchange="charData[${i}].critRate=this.value">
            <input type="text" placeholder="치피" value="${c.critDmg||''}" onchange="charData[${i}].critDmg=this.value">
            <input type="text" placeholder="원마" value="${c.em||''}" onchange="charData[${i}].em=this.value">
            <input type="text" placeholder="원충" value="${c.er||''}" onchange="charData[${i}].er=this.value">
          </div>
          <div>
            <textarea placeholder="📌 참고 메모" onchange="charData[${i}].memo=this.value">${c.memo||''}</textarea>
          </div>
        `;
        container.appendChild(item);
      });
    }

    draw();
  </script>
</body>
</html>
